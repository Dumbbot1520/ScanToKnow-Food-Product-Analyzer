name: main_project_files
description: "ScanToKnow – UI + OCR + Barcode integrated app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ---------------- Core UI ----------------
  cupertino_icons: ^1.0.8

  # ---------------- Navigation & UX ----------------
  curved_navigation_bar: ^1.0.6
  tutorial_coach_mark: ^1.2.3

  # ---------------- Local Storage ----------------
  shared_preferences: ^2.1.1

  # ---------------- Networking ----------------
  http: ^1.1.0

  # ---------------- Images ----------------
  cached_network_image: ^3.2.3
  image: ^4.1.3

  # ---------------- Camera & Scanning ----------------
  camera: ^0.11.0+2

  # Google ML Kit (Barcode Scanning)
  google_mlkit_barcode_scanning: ^0.10.0

  # (Optional but safe – used internally by ML Kit)
  google_mlkit_commons: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/packet_images/
    - images/intro_page_images/
    - images/home_page_images/
